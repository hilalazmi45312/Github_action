name: Auto-sync Senheng-1 -> Senheng-3 (Mirror Mode)

on:
  push:
    branches:
      - staging
      - production

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source repo (Senheng-1)
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false   # IMPORTANT: allow PAT to be used

      # 2. Configure Git identity
      - name: Configure Git
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      # 3. Add target remote (Senheng-3)
      - name: Add target remote (Senheng-3)
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          echo "Adding target remote (Senheng-3)..."
          git remote add target "https://x-access-token:${GH_TOKEN}@github.com/hilalazmi45312/Github_action.git"

      # 4. Mirror push branch to target repo
      - name: Mirror branch to Senheng-3
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          echo "Mirroring branch ${GITHUB_REF_NAME} to Senheng-3..."
          git push target \
            ${GITHUB_REF_NAME}:${GITHUB_REF_NAME} \
            --force-with-lease
