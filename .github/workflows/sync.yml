name: Auto-sync Senheng-1 -> Senheng-2

on:
  push:
    branches:
      - staging
      - production

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source repo (Senheng-1)
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Configure Git
      - name: Configure Git
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      # 3. Merge changes into Senheng-2
      - name: Merge branch into Senheng-2
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          echo "Syncing branch ${GITHUB_REF_NAME} to Senheng-2..."
          git remote add target https://x-access-token:${GH_TOKEN}@github.com/wpcomvip/senheng-2.git
          
          # Fetch the remote branch from Senheng-2
          git fetch target ${GITHUB_REF_NAME}

          # Merge source branch into target branch
          git checkout -B ${GITHUB_REF_NAME} target/${GITHUB_REF_NAME} || git checkout -b ${GITHUB_REF_NAME}
          git merge --no-ff --commit --allow-unrelated-histories ${GITHUB_REF_NAME}

          # Push merged changes
          git push target ${GITHUB_REF_NAME}
