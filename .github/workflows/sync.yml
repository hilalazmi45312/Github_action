name: Auto-sync Senheng-1 -> Senheng-2

on:
  push:
    branches:
      - staging
      - production   # trigger on both branches

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the source repo (Senheng-1)
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Configure Git
      - name: Configure Git
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      # 3. Push the branch to Senheng-2
      - name: Push branch to Senheng-2
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}  # PAT with write access to Senheng-2
        run: |
          echo "Syncing branch ${GITHUB_REF_NAME} to Senheng-2..."
          git remote add target https://x-access-token:${GH_TOKEN}@github.com/wpcomvip/senheng-2.git
          git push target ${GITHUB_REF_NAME} --force
